<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodnocení Galaxie</title>
    <!-- Tailwind CSS pro moderní vzhled -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <!-- Načítací obrazovka -->
        <div id="loader" class="flex-grow flex items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        </div>

        <!-- Obrazovka pro přihlášení -->
        <div id="login-screen" class="hidden flex-grow flex flex-col items-center justify-center text-center space-y-6">
            <div class="bg-white p-8 rounded-3xl shadow-xl w-full border border-slate-100">
                <div class="w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.382-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Hodnocení Galaxie</h1>
                <p class="text-slate-500 mt-2">Přihlaste se prosím svým školním Google účtem</p>
                
                <button id="btn-login" class="mt-8 w-full bg-white border border-slate-300 text-slate-700 py-3 px-4 rounded-xl font-semibold flex items-center justify-center space-x-3 hover:bg-slate-50 transition-all shadow-sm active:scale-95">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                    <span>Přihlásit se přes Google</span>
                </button>
            </div>
        </div>

        <!-- Hlavní prostředí po přihlášení -->
        <div id="main-screen" class="hidden flex-grow space-y-4">
            <header class="flex justify-between items-center py-2">
                <div class="flex items-center space-x-3">
                    <img id="user-photo" class="w-10 h-10 rounded-full border-2 border-white shadow-sm" src="" alt="Avatar">
                    <div>
                        <p id="user-name" class="font-semibold text-slate-800 text-sm leading-tight"></p>
                        <p class="text-xs text-blue-600 font-medium">Učitel Galaxie</p>
                    </div>
                </div>
                <button id="btn-logout" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </header>

            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl p-6 text-white shadow-lg">
                <h2 class="text-lg opacity-80">Dobrý den,</h2>
                <p class="text-2xl font-bold mt-1">Pojďme dnes hodnotit!</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 active:scale-95 transition-transform">
                    <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    </div>
                    <span class="text-sm font-semibold text-slate-700">Přidat body</span>
                </button>
                <button class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center space-y-2 active:scale-95 transition-transform">
                    <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <span class="text-sm font-semibold text-slate-700">Seznam tříd</span>
                </button>
            </div>

            <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm flex-grow">
                <h3 class="font-bold text-slate-800 mb-4">Aktuální přehled</h3>
                <div id="placeholder-content" class="flex flex-col items-center justify-center py-12 text-slate-400 space-y-3">
                    <svg class="w-12 h-12 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                    <p class="text-sm">Zatím nebyla provedena žádná akce.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Moduly -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

        // Vaše osobní konfigurace z obrázků
        const firebaseConfig = {
            apiKey: "AIzaSyDm0v4wvid36KgLr3WUDtkNZ-DPmXFDZbs",
            authDomain: "hodnocenigalaxie.firebaseapp.com",
            projectId: "hodnocenigalaxie",
            storageBucket: "hodnocenigalaxie.firebasestorage.app",
            messagingSenderId: "803231734039",
            appId: "1:803231734039:web:027d443d60869288027f52",
            measurementId: "G-WDFNSPS8EX"
        };

        // Inicializace aplikace
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // UI Prvky
        const ui = {
            loader: document.getElementById('loader'),
            login: document.getElementById('login-screen'),
            main: document.getElementById('main-screen'),
            name: document.getElementById('user-name'),
            photo: document.getElementById('user-photo')
        };

        // Sledování stavu uživatele
        onAuthStateChanged(auth, (user) => {
            ui.loader.classList.add('hidden');
            if (user) {
                ui.name.textContent = user.displayName;
                ui.photo.src = user.photoURL || 'https://via.placeholder.com/40';
                ui.login.classList.add('hidden');
                ui.main.classList.remove('hidden');
            } else {
                ui.login.classList.remove('hidden');
                ui.main.classList.add('hidden');
            }
        });

        // Obsluha tlačítek
        document.getElementById('btn-login').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                if (error.code === 'auth/popup-blocked') {
                    alert("Vyskakovací okno bylo zablokováno. Prosím, povolte vyskakovací okna pro tuto stránku.");
                } else {
                    alert("Nepodařilo se přihlásit: " + error.message);
                }
            }
        };

        document.getElementById('btn-logout').onclick = () => signOut(auth);
    </script>
</body>
</html>
