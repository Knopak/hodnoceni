        .no-print { padding: 20px; background: #fff; border-bottom: 1px solid #ddd; }
        .container { max-width: 900px; margin: 20px auto; background: var(--white); padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; }
        .logo { max-height: 70px; }
        .header-info { text-align: right; }
        h2 { color: var(--primary); border-left: 5px solid var(--accent); padding-left: 15px; margin-top: 35px; font-size: 1.3em; }
        textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 14px; box-sizing: border-box; resize: vertical; }
        textarea:disabled { background: #f9f9f9; color: #777; border-color: #eee; }
        .competency-item { margin-bottom: 45px; page-break-inside: avoid; }
        .question-text { font-weight: bold; color: var(--primary); display: block; font-size: 1.1em; }
        .question-desc { font-size: 0.85em; color: #666; margin-bottom: 15px; display: block; font-style: italic; line-height: 1.3; }
        .scale-options { display: flex; gap: 8px; justify-content: flex-start; }
        .scale-box { flex: 1; min-width: 80px; padding: 10px 5px; border: 2px solid var(--accent); text-align: center; cursor: pointer; transition: 0.2s; font-weight: bold; font-size: 0.85em; color: var(--accent); border-radius: 4px; }
        .scale-box.active { background: var(--accent); color: white; }
        .scale-labels { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.75em; color: #999; text-transform: uppercase; }
        .student-comment { margin-top: 10px; background: #fcfcfc; padding: 10px; border: 1px dashed #ddd; border-radius: 4px; }
        .student-comment label { font-size: 0.8em; color: #555; font-weight: bold; display: block; margin-bottom: 5px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }
        #studentSelector { padding: 12px; margin: 10px 0; width: 100%; max-width: 400px; border-radius: 4px; border: 1px solid var(--accent); }
        .save-bar { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000; }
        @media print { .no-print, .save-bar, #studentSelector { display: none !important; } .container { box-shadow: none; border: none; width: 100%; padding: 0; } textarea { border: none; } }

    { id: "q6", text: "Přispíváš k vytváření bezpečného prostředí", desc: "Nikoho neshazuji a neposmívám se." },
    { id: "q7", text: "Zodpovědně přistupuješ k učení", desc: "Mám pomůcky a plním úkoly." },
    { id: "q8", text: "Vytrváš v práci na obtížných úkolech", desc: "Když mi něco nejde, nevzdávám to." }
];

let currentUser = null;
let currentTargetStudent = null;
let currentData = {};

auth.onAuthStateChanged(user => {
    if (user) { currentUser = user; initApp(); } 
    else { showLogin(); }
});

function showLogin() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-container').innerHTML = `<div style="text-align:center; margin-top:100px;"><button class="btn btn-primary" onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())">Přihlásit se školním účtem</button></div>`;
}

function initApp() {
    const email = currentUser.email.toLowerCase();
    document.getElementById('auth-container').innerHTML = `<div style="display:flex; justify-content:space-between; padding:10px;"><span>Uživatel: ${email}</span><button onclick="auth.signOut()">Odhlásit</button></div>`;
    if (STUDENTS[email]) { currentTargetStudent = email; loadStudentData(email); } 
    else if (TEACHERS[email]) { renderTeacherUI(); }
}

function renderTeacherUI() {
    document.getElementById('app').style.display = 'block';
    let html = `<select id="studentSelector" onchange="loadStudentData(this.value)"><option value="">-- Vyberte žáka --</option>`;
    Object.keys(STUDENTS).sort((a,b) => STUDENTS[a].class.localeCompare(STUDENTS[b].class) || STUDENTS[a].name.localeCompare(STUDENTS[b].name))
          .forEach(e => { html += `<option value="${e}">${STUDENTS[e].class} - ${STUDENTS[e].name}</option>`; });
    document.getElementById('role-ui').innerHTML = html + `</select>`;
}

async function loadStudentData(email) {
    if (!email) return;
    currentTargetStudent = email;
    document.getElementById('student-header-name').innerText = STUDENTS[email].name + " (" + STUDENTS[email].class + ")";
    const doc = await db.collection('hodnoceni').doc(email).get();
    currentData = doc.exists ? doc.data() : { scales: {}, comments: {}, intro: "", notes: "" };
    document.getElementById('class-teacher-intro').value = currentData.intro || "";
    document.getElementById('teachers-notes').value = currentData.notes || "";
    document.getElementById('app').style.display = 'block';
    renderForm();
}

function renderForm() {
    const area = document.getElementById('competencies-area');
    area.innerHTML = '';
    const isTeacher = !!TEACHERS[currentUser.email.toLowerCase()];
    const isClassTeacher = isTeacher && TEACHERS[currentUser.email.toLowerCase()] === STUDENTS[currentTargetStudent].class;

    QUESTIONS.forEach(q => {
        const div = document.createElement('div');
        div.className = 'competency-item';
        div.innerHTML = `
            <span class="question-text">${q.text}</span>
            <span class="question-desc">${q.desc}</span>
            <div class="scale-options">
                ${SCALE_LABELS.map(label => `<div class="scale-box ${currentData.scales?.[q.id] === label ? 'active' : ''}" onclick="${isTeacher ? `updateScale('${q.id}', '${label}')` : ''}">${label}</div>`).join('')}
            </div>
            <div class="student-comment">
                <label>Vysvětlení žáka:</label>
                <textarea id="comment-${q.id}" rows="2" ${isTeacher ? 'disabled' : ''}>${currentData.comments?.[q.id] || ''}</textarea>
            </div>`;
        area.appendChild(div);
    });
    document.getElementById('class-teacher-intro').disabled = !isClassTeacher;
    document.getElementById('teachers-notes').disabled = !isTeacher;
}

function updateScale(qId, val) {
    if (!currentData.scales) currentData.scales = {};
    currentData.scales[qId] = val;
    loadStudentData(currentTargetStudent); // Refresh UI
}

async function saveData() {
    const comments = {};
    QUESTIONS.forEach(q => { comments[q.id] = document.getElementById(`comment-${q.id}`).value; });
    await db.collection('hodnoceni').doc(currentTargetStudent).set({
        scales: currentData.scales || {},
        comments: comments,
        intro: document.getElementById('class-teacher-intro').value,
        notes: document.getElementById('teachers-notes').value,
        lastUpdate: new Date()
    }, { merge: true });
    alert("Uloženo!");
}
</script>
</body>
</html>
