        // BEZPEČNOSTNÍ POMOCNÉ FUNKCE PROTI PÁDŮM SKRIPTU
        function setHTML(id, content) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = content;
        }

        function setText(id, content) {
            const el = document.getElementById(id);
            if (el) el.textContent = content;
        }

        function setVal(id, content) {
            const el = document.getElementById(id);
            if (el) el.value = content;
        }

        function showEl(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('hidden');
        }

        function hideEl(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        }

        function toggleEl(id, forceShow) {
            const el = document.getElementById(id);
            if (el) {
                if(forceShow) el.classList.remove('hidden');
                else el.classList.add('hidden');
            }
        }

        function disableEl(id, disabled) {
            const el = document.getElementById(id);
            if (el) el.disabled = disabled;
        }

        function autoResize(el) { 
            if(!el) return; 
            el.style.height = 'auto'; 
            el.style.height = el.scrollHeight + 'px'; 
        }

        // Formátování textu pro tisk (odsazení všech odstavců vč. prvního)
        function formatForPrint(text) {
            if (!text) return "";
            return text.split('\n').map(line => {
                if(line.trim() === '') return '<div class="h-2 print:h-1"></div>';
                return `<div class="indent-6 text-justify">${line}</div>`;
            }).join('');
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            if (!t) return;
            
            if (isError) {
                t.className = "fixed bottom-6 right-6 bg-red-600 text-white px-8 py-4 rounded-2xl shadow-2xl font-bold transform translate-y-24 opacity-0 transition-all duration-500 z-[100] flex items-center gap-3 no-print";
                setHTML('toast', `<i data-lucide="alert-circle" class="w-5 h-5"></i> ${msg}`);
            } else {
                t.className = "fixed bottom-6 right-6 bg-emerald-600 text-white px-8 py-4 rounded-2xl shadow-2xl font-bold transform translate-y-24 opacity-0 transition-all duration-500 z-[100] flex items-center gap-3 no-print";
                setHTML('toast', `<i data-lucide="check-circle-2" class="w-5 h-5"></i> ${msg}`);
            }
            
            t.style.transform = 'translateY(0)'; 
            t.style.opacity = '1'; 
            try { lucide.createIcons(); } catch(e) {}
            
            setTimeout(() => { 
                t.style.opacity = '0'; 
                t.style.transform = 'translateY(24px)';

        auth.onAuthStateChanged(user => {

                const email = user.email ? user.email.toLowerCase() : "";
                isAdmin = ADMIN_EMAILS.includes(email);
                
                hideEl('auth-screen');
                showEl('app-screen');
                
                if (TEACHERS[email] !== undefined) { 
                    userRole = 'teacher'; 
                    setupTeacherUI(); 
                } else if (STUDENTS[email]) { 
                    userRole = 'student'; 
                    setupStudentUI(email); 
                } else {

        function loginWithGoogle() { 
            showToast("Otevírám přihlášení...");
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                console.error("Detailní chyba Firebase Auth:", err);
                if (err.code === 'auth/popup-blocked') {
                    showToast("Prohlížeč zablokoval vyskakovací okno. Povolte pop-upy pro tento web.", true);
                } else {
                    showToast("Chyba přihlášení: " + err.message, true);
                }
            }); 
        }

        function setupTeacherUI() {
            const classes = [...new Set(Object.values(STUDENTS).map(s => s.class))].sort();
            const classSelect = document.getElementById('classSelect');
            if(classSelect) {
                classSelect.innerHTML = '<option value="">Třída</option>';
                classes.forEach(c => classSelect.add(new Option(c, c)));
            }
            showEl('controls-container');
            hideEl('student-notice');
        }

        function onClassChange() {
            const classSelect = document.getElementById('classSelect');
            const studentSelect = document.getElementById('studentSelect');
            const cls = classSelect ? classSelect.value : null;
            if (studentSelect) {
                studentSelect.innerHTML = '<option value="">Vyberte žáka</option>';
                if(cls) {
                    const filtered = Object.entries(STUDENTS).filter(([e, d]) => d.class === cls).sort((a,b) => a[1].name.localeCompare(b[1].name));
                    filtered.forEach(([e, d]) => studentSelect.add(new Option(d.name, e)));
                }
            }
        }

        function setupStudentUI(email) {
            document.getElementById('controls-container').classList.add('hidden');
            document.getElementById('student-notice').classList.remove('hidden');
            document.getElementById('printBtn').classList.add('hidden');
            loadStudentData(email);
        }

        async function loadStudentData(forcedEmail = null) {
            try {
                const email = forcedEmail || document.getElementById('studentSelect').value;
                if (!email) return;
                
                currentTargetEmail = null;
                document.getElementById('studentNameDisplay').textContent = "Načítám data...";
                
                const studentInfo = STUDENTS[email];
                
                const currUser = auth.currentUser;
                if (!currUser) return;
                const currentUserEmail = currUser.email ? currUser.email.toLowerCase() : "";
                
                isAdmin = ADMIN_EMAILS.includes(currentUserEmail);
                isClassTeacher = (TEACHERS[currentUserEmail] === studentInfo.class) || isAdmin;

                document.getElementById('classNameDisplay').textContent = "Třída: " + studentInfo.class;
                
                try {
                    const doc = await db.collection('evaluations').doc(email).get();
                    if (doc.exists) {
                        studentDocData = doc.data();
                        
                        if (!studentDocData.periods) {
                            studentDocData.periods = {};

        async function saveSettings() {
            const newYear = document.getElementById('yearSelect').value;
            const newTerm = document.getElementById('termSelect').value;
            const periodKey = `${newYear}_${newTerm}`;
            
            const currUser = auth.currentUser;
            if (!currUser) return;
            
            if (!currentTargetEmail || !STUDENTS[currentTargetEmail]) {
                showToast("Chyba: Není vybrán žádný žák.", true);
                closeSettingsModal();
                return;
            }

            const currentStudentClass = STUDENTS[currentTargetEmail].class;
            showToast(`Aktualizuji data pro celou třídu ${currentStudentClass}...`);

            const classStudents = Object.entries(STUDENTS)
                .filter(([email, data]) => data.class === currentStudentClass)
                .map(([email]) => email);

            try {
                const updatePromises = classStudents.map(async (studentEmail) => {
                    let docData = { activeYear: newYear, activeTerm: newTerm, periods: {} };
                    try {
                        const doc = await db.collection('evaluations').doc(studentEmail).get();
                        if (doc.exists) {
                            docData = doc.data();
                            docData.activeYear = newYear;
                            docData.activeTerm = newTerm;
                            if (!docData.periods) docData.periods = {};
                        }
                    } catch (e) {
                        console.error("Chyba čtení u žáka: " + studentEmail);
                    }

                    if (!docData.periods[periodKey]) {
                        docData.periods[periodKey] = {
                            teacherScales: {}, studentScales: {}, categoryComments: {}, 
                            colleagueObservations: {}, teacherComments: {}, topNote: "", bottomNote: ""
                        };
                    }

                    return db.collection('evaluations').doc(studentEmail).set(docData, { merge: true });
                });

                await Promise.all(updatePromises);
                showToast("Období nastaveno pro všechny žáky třídy.");
                
                if(currentTargetEmail) {
                    loadStudentData(currentTargetEmail);
                }
            } catch(e) {
                console.error(e);
                showToast("Chyba při hromadném ukládání.", true);
            }
            closeSettingsModal();
        }

        async function confirmDelete() {
            if (!deleteCandidateEmail || !currentTargetEmail) return;
            const email = deleteCandidateEmail;
            
            if (dbData.colleagueObservations && dbData.colleagueObservations[email]) {
                delete dbData.colleagueObservations[email];
            }
            if (dbData.teacherComments && dbData.teacherComments[email]) {
                delete dbData.teacherComments[email];
            }
            
            const periodKey = `${dbData.schoolYear}_${dbData.term}`;
            studentDocData.periods[periodKey] = dbData;

            try {
                await db.collection('evaluations').doc(currentTargetEmail).update({
                    [`periods.${periodKey}.colleagueObservations.${email}`]: firebase.firestore.FieldValue.delete(),
                    [`periods.${periodKey}.teacherComments.${email}`]: firebase.firestore.FieldValue.delete()
                });
                showToast(`Data od ${email} smazána z databáze.`);
            } catch (e) {
                console.warn("Update selhal, zkouším klasický set.", e);
                await db.collection('evaluations').doc(currentTargetEmail).set(studentDocData);
                showToast(`Data smazána lokálně.`);
            }

            closeDeleteModal(); 
            renderSummary(); 
            renderTeacherScales(); 
        }

        function applyAverages() {
            if (!isClassTeacher) return;
            const obs = dbData.colleagueObservations || {};
            if (!dbData.teacherScales) dbData.teacherScales = {}; 
            
            COMPETENCIES.forEach(q => {
                let sum = 0, tot = 0;
                Object.values(obs).forEach(d => { 
                    if(d && typeof d === 'object' && d[q.id] !== undefined) { 
                        sum += d[q.id]; 
                        tot++; 
                    } 
                });
                if (tot > 0) { 
                    dbData.teacherScales[q.id] = Math.round(sum/tot); 
                }
            });
            renderTeacherScales(); 
            showToast("Průměry škál propsány.");
        }

        function applyTextSummaries() {
            if (!isClassTeacher) return;
            const comms = dbData.teacherComments || {};
            let combined = "";
            
            Object.values(comms).forEach(text => { 
                if(typeof text === 'string' && text.trim() !== "") {
                    combined += `${text.trim()}\n\n`; 
                }
            });
            
            const sIn = document.getElementById('summaryInput');
            if (sIn) {
                const existingContent = sIn.value.trim();
                const newContent = combined.trim();
                
                if (newContent) {
                    if (existingContent) {
                        sIn.value = existingContent + "\n\n" + newContent;
                    } else {
                        sIn.value = newContent;
                    }
                    autoResize(sIn); 
                    showToast("Texty přidány ke stávajícímu obsahu.");
                } else {
                    showToast("Zatím nejsou žádné texty k propsání.");
                }
            }
        }

            if(userRole === 'student' || isAdmin || isClassTeacher){ 
                if(!dbData.studentScales) dbData.studentScales = {}; 
                if (dbData.studentScales[id] === v) {
                    delete dbData.studentScales[id];
                } else {
                    dbData.studentScales[id] = v; 
                }
                renderStudentScales(); 
            } 
        }

        function clearStudentSelfEval() {
            if (!confirm("Opravdu vymazat celé sebehodnocení tohoto žáka?")) return;
            dbData.studentScales = {};
            dbData.categoryComments = {};
            renderStudentScales();
            showToast("Sebehodnocení vymazáno. Nezapomeňte kliknout na Uložit.");
        }

        async function downloadAllData() {
            try {
                const snap = await db.collection('evaluations').get();
                const allData = {}; 
                snap.forEach(doc => { allData[doc.id] = doc.data(); });
                
                const blob = new Blob([JSON.stringify(allData, null, 2)], {type : 'application/json'});
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = `zaloha_galaxie_${new Date().toISOString().slice(0,10)}.json`; 
                a.click();
                showToast("Kompletní záloha stažena.");
            } catch (e) { 
                showToast("Chyba zálohy: Nemáte povolen přístup ve Firebase Rules.", true); 
            }
        }

        async function saveData() {
            if(!currentTargetEmail) return;
            const currUser = auth.currentUser;
            if(!currUser) return;
            const email = currUser.email.toLowerCase();
            
            const periodKey = `${dbData.schoolYear}_${dbData.term}`;
            
            try {
                // 1. Těsně před uložením si stáhneme to nejnovější z databáze (ochrana proti přepsání cizích dat)
                const docRef = db.collection('evaluations').doc(currentTargetEmail);
                const docSnap = await docRef.get();
                
                let latestDocData = docSnap.exists ? docSnap.data() : { periods: {} };
                if (!latestDocData.periods) latestDocData.periods = {};
                let latestPeriod = latestDocData.periods[periodKey] || {
                    teacherScales: {}, studentScales: {}, categoryComments: {}, 
                    colleagueObservations: {}, teacherComments: {}, topNote: "", bottomNote: ""
                };

                // 2. Přimícháme pouze úpravy tohoto konkrétního uživatele
                if(userRole === 'teacher' || isAdmin) { 
                    
                    // Finální text odemčen pro ukládání VŠEM učitelům
                    latestPeriod.bottomNote = document.getElementById('summaryInput').value; 

                    // Následující položky ukládá pouze třídní učitel nebo admin
                    if(isClassTeacher || isAdmin) {
                        latestPeriod.topNote = document.getElementById('schoolYearNoteInput').value; 
                        latestPeriod.teacherScales = dbData.teacherScales || {};
                        latestPeriod.studentScales = dbData.studentScales || {};
                        latestPeriod.categoryComments = dbData.categoryComments || {};
                    }
                    
                    if(!latestPeriod.teacherComments) latestPeriod.teacherComments = {};
                    latestPeriod.teacherComments[email] = document.getElementById('myPersonalComment').value;
                    
                    if(!latestPeriod.colleagueObservations) latestPeriod.colleagueObservations = {};
                    if(dbData.colleagueObservations && dbData.colleagueObservations[email] !== undefined) {
                        latestPeriod.colleagueObservations[email] = dbData.colleagueObservations[email];
                    }
                }
                
                if (userRole === 'student') {
                    latestPeriod.studentScales = dbData.studentScales || {};
                    latestPeriod.categoryComments = dbData.categoryComments || {};
                }
                
                // 3. Uložíme sloučený celek
                latestDocData.periods[periodKey] = latestPeriod;
                await docRef.set(latestDocData, { merge: true });
                
                // 4. Přepíšeme lokální paměť
                dbData = latestPeriod;
                studentDocData = latestDocData;
                
                showToast("Změny úspěšně uloženy.");
                
                document.getElementById('schoolYearNoteDisplay').innerHTML = formatForPrint(dbData.topNote);
                document.getElementById('summaryDisplay').innerHTML = formatForPrint(dbData.bottomNote);
                
                if (userRole === 'teacher' || isAdmin) {
                    renderTeacherScales();
                    renderSummary();
                }
                
            } catch (e) {
                showToast("Nelze uložit! Zkontrolujte Firebase pravidla. Chyba: " + e.message, true);
            }
        }
    </script>
</body>
</html>
