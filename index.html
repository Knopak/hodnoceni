        .hidden { display: none !important; }
        .print-only { display: none; }
        textarea { resize: none; overflow: hidden; transition: height 0.1s ease; border: 1px solid #e2e8f0; }
        textarea:disabled { background-color: #f8fafc; color: #64748b; cursor: not-allowed; }
        .scale-btn { transition: all 0.2s; border: 1px solid #cbd5e1; font-size: 0.75rem; font-weight: 600; padding: 0.5rem 0.25rem; border-radius: 0.375rem; }
        .scale-btn:not(:disabled):hover { border-color: #0ea5e9; }
        .scale-btn:active { transform: scale(0.95); }

        /* Vynucená světle modrá barva pro legendy */
        .print-legend { color: #0ea5e9; }

        @media print {
            @page { size: A4; margin: 0; }
            html, body { background-color: white !important; margin: 0; padding: 0; font-size: 10pt; width: 100%; overflow: visible !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-flex { display: flex !important; }
            
            /* Pravidlo pro viditelnost legendy při tisku */
            .print-legend {
                display: flex !important;
                color: #0ea5e9 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            #print-container { padding: 10mm 15mm !important; box-shadow: none !important; width: 100% !important; page-break-after: always; display: block !important; }
            #page-2-container { padding: 10mm 15mm !important; display: block !important; box-shadow: none !important; width: 100% !important; }
            textarea { display: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

                <div id="student-notice" class="hidden text-blue-700 font-bold flex items-center gap-2 bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">

                <div class="flex items-center gap-3">
                    <button onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-md transition-colors">
                        <i data-lucide="save" class="w-4 h-4"></i> Uložit

        async function loadStudentData(forcedEmail) {
            const email = forcedEmail || document.getElementById('studentSelect').value;
            if (!email) return;
            currentTargetEmail = email;
            const studentInfo = STUDENTS[email];
            isClassTeacher = (userRole === 'teacher' && TEACHERS[auth.currentUser.email.toLowerCase()] === studentInfo.class);

            document.getElementById('classNameDisplay').textContent = "Třída: " + studentInfo.class;
            dbData = { teacherScales: {}, studentScales: {}, categoryComments: {}, topNote: "", bottomNote: "", teacherNotes: {} };
            
            const cached = loadFromCache();
            const doc = await db.collection('evaluations').doc(email).get();
            const serverData = doc.exists ? doc.data() : {};
            if (cached && cached.ts > (serverData._savedAt || 0)) {
                dbData = { ...dbData, ...cached, teacherNotes: { ...(serverData.teacherNotes || {}), ...(cached.teacherNotes || {}) } };

                dbData = { ...dbData, ...serverData };

            renderForms(studentInfo.name);

        function computeAveragedScales(data) {
            const teacherKeys = Object.keys(data).filter(k => k.startsWith('teacherScales_'));
            if (teacherKeys.length === 0) return data.teacherScales || {};
            const sums = {}, counts = {};
            teacherKeys.forEach(key => {
                const scales = data[key] || {};
                Object.entries(scales).forEach(([id, val]) => {
                    if (val !== undefined && val !== null) {
                        sums[id] = (sums[id] || 0) + val;
                        counts[id] = (counts[id] || 0) + 1;
                    }
                });
            });
            const avg = {};
            Object.keys(sums).forEach(id => {
                avg[id] = Math.round(sums[id] / counts[id]);
            });
            return avg;
        }

                            id="cat-${cat}"
                            data-cat="${cat}"
                            class="w-full p-2 border rounded-xl text-xs bg-blue-50 focus:bg-white focus:ring-2 focus:ring-blue-100"
                            placeholder="Shrň své hodnocení..."
                            rows="1"
                            oninput="autoResize(this); dbData.categoryComments[this.dataset.cat] = this.value"
                            ${disabledAttr}>${comm}</textarea>
                        <div class="print-only text-sm italic mt-3 leading-relaxed text-slate-700 border-l-4 pl-4 font-print" style="border-color: #0ea5e9;">${comm}</div>
                    </div>
                </div>`;
                container.innerHTML += h;
            });
        }

        function setTeacherScale(id, v) {
            if (userRole === 'teacher') {
                const myEmail = auth.currentUser.email.toLowerCase();
                const key = 'teacherScales_' + myEmail;
                if (!dbData[key]) dbData[key] = {};
                dbData[key][id] = v;
                dbData.teacherScales = computeAveragedScales(dbData);
                renderTeacherScales();
            }
        }

        function setStudentScale(id, v) {
            if (userRole === 'student') { dbData.studentScales[id] = v; renderStudentScales(); }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        let autosaveTimer = null;
        const CACHE_PREFIX = 'galaxie_cache_';

        function getCacheKey() {
            return CACHE_PREFIX + (currentTargetEmail || 'none');
        }

        function saveToCache() {
            if (!currentTargetEmail) return;
            try {
                if (userRole === 'teacher') {
                    if (isClassTeacher) {
                        dbData.topNote = document.getElementById('schoolYearNoteInput').value;
                        dbData.bottomNote = document.getElementById('summaryInput').value;
                    } else {
                        const myEmail = auth.currentUser.email.toLowerCase();
                        if (!dbData.teacherNotes) dbData.teacherNotes = {};
                        dbData.teacherNotes[myEmail] = document.getElementById('summaryInput').value;
                    }
                }
                const payload = JSON.stringify({ data: dbData, ts: Date.now() });
                localStorage.setItem(getCacheKey(), payload);
            } catch(e) { console.warn('Cache write failed', e); }
        }

        function loadFromCache() {
            try {
                const raw = localStorage.getItem(getCacheKey());
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (Date.now() - parsed.ts > 86400000) { localStorage.removeItem(getCacheKey()); return null; }
                return parsed.data;
            } catch(e) { return null; }
        }

        function clearCache() {
            try { localStorage.removeItem(getCacheKey()); } catch(e) {}
        }

        function scheduleAutosave() {
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(async () => {
                saveToCache();
                await saveData(true);
            }, 30000);
        }

        function attachAutosaveListeners() {
            ['summaryInput', 'schoolYearNoteInput'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', scheduleAutosave);
            });
            document.addEventListener('click', e => {
                if (e.target.classList.contains('scale-btn')) scheduleAutosave();
            });
        }

        async function reloadTeacherNotes() {
            if (!currentTargetEmail || !isClassTeacher) return;
            const btn = document.getElementById('reloadNotesBtn');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Načítám...';
            lucide.createIcons();
            try {
                const doc = await db.collection('evaluations').doc(currentTargetEmail).get();
                const freshData = doc.exists ? doc.data() : {};
                dbData.teacherNotes = freshData.teacherNotes || {};
                const notes = dbData.teacherNotes;
                const combined = Object.entries(notes)
                    .filter(([, v]) => v && v.trim())
                    .map(([email, note]) => {
                        const nick = TEACHER_NICKNAMES[email] || email.split('.')[0];
                        return nick + ':\n' + note.trim();
                    })
                    .join('\n\n---\n\n');
                document.getElementById('summaryInput').value = combined;
                dbData.bottomNote = combined;
                autoResize(document.getElementById('summaryInput'));
                saveToCache();
                const t = document.getElementById('toast');
                t.innerHTML = '<i data-lucide="refresh-cw" class="w-5 h-5"></i> Poznámky načteny';
                t.style.transform = 'translateY(0)'; t.style.opacity = '1';
                setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(24px)'; t.innerHTML = '<i data-lucide="check-circle-2"></i> Úspěšně uloženo'; }, 2500);
            } catch(e) { alert('Chyba při načítání: ' + e.message); }
            btn.disabled = false;
            btn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4"></i> Načíst od kolegů';
            lucide.createIcons();
        }

        function closeSvodka() {
            document.getElementById('svodka-modal').classList.add('hidden');
        }

        async function openSvodka() {
            if (!currentTargetEmail) return;
            const studentInfo = STUDENTS[currentTargetEmail];
            document.getElementById('svodka-student-name').textContent = studentInfo.name + ' – ' + studentInfo.class;

            const doc = await db.collection('evaluations').doc(currentTargetEmail).get();
            const data = doc.exists ? doc.data() : {};

            const teacherKeys = Object.keys(data).filter(k => k.startsWith('teacherScales_'));
            const teacherEmails = teacherKeys.map(k => k.replace('teacherScales_', ''));
            const hasShared = data.teacherScales && Object.keys(data.teacherScales).length > 0;

            const cats = [...new Set(COMPETENCIES.map(c => c.cat))];
            const CAT_ICONS = {
                'Ve vztahu k sobě': '🌱',
                'Ve vztahu k druhým': '🤝',
                'Při učení': '📚'
            };
            const SCALE_COLORS = ['#ef4444','#f97316','#0ea5e9','#22c55e'];
            const SCALE_SHORT = ['Ne','Sp.ne','Sp.ano','Ano'];

            function scaleBoxes(val) {
                let html = '<div class="flex gap-0.5 justify-center">';
                for (let i = 0; i < 4; i++) {
                    const filled = val !== undefined && val !== null && i <= val;
                    html += `<div style="width:12px;height:12px;border-radius:2px;border:1px solid #cbd5e1;background:${filled ? SCALE_COLORS[val] : '#f1f5f9'};opacity:${filled ? 1 : 0.4}"></div>`;
                }
                html += '</div>';
                if (val !== undefined && val !== null) {
                    html += `<div style="font-size:9px;color:#64748b;text-align:center;margin-top:1px">${SCALE_SHORT[val]}</div>`;
                }
                return html;
            }

            const columns = [];
            if (hasShared) columns.push({ label: 'Aktuální<br>(výsledek)', scales: data.teacherScales, isResult: true });
            teacherEmails.forEach(email => {
                const nick = TEACHER_NICKNAMES[email] || email.split('.')[0];
                columns.push({ label: nick, scales: data[`teacherScales_${email}`] || {}, isResult: false });
            });

            if (columns.length === 0) {
                document.getElementById('svodka-content').innerHTML = '<p class="text-slate-400 text-center py-12">Zatím žádné hodnocení od učitelů.</p>';
                document.getElementById('svodka-modal').classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            let html = '<table class="w-full text-xs border-collapse">';
            html += '<thead><tr>';
            html += '<th class="text-left py-2 px-3 text-slate-500 uppercase text-[10px] tracking-wide font-bold border-b-2 border-slate-200 w-48">Kompetence</th>';
            columns.forEach(col => {
                const bg = col.isResult ? 'bg-violet-50' : 'bg-slate-50';
                const fw = col.isResult ? 'font-black text-violet-800' : 'font-bold text-slate-600';
                html += `<th class="py-2 px-2 text-center border-b-2 border-slate-200 ${bg} ${fw} text-[10px] uppercase tracking-wide min-w-[70px]">${col.label}</th>`;
            });
            html += '</tr></thead><tbody>';

            cats.forEach(cat => {
                const icon = CAT_ICONS[cat] || '';
                html += `<tr><td colspan="${columns.length + 1}" class="py-2 px-3 font-black text-[11px] uppercase tracking-wider text-slate-700 bg-slate-50 border-t border-slate-200">${icon} ${cat}</td></tr>`;
                COMPETENCIES.filter(c => c.cat === cat).forEach((q, qi) => {
                    const rowBg = qi % 2 === 0 ? '' : 'bg-slate-50/50';
                    html += `<tr class="${rowBg}">`;
                    html += `<td class="py-2 px-3 text-slate-700 font-medium leading-tight border-b border-slate-100">${q.text}</td>`;
                    columns.forEach(col => {
                        const val = col.scales[q.id];
                        const bg = col.isResult ? 'bg-violet-50/50' : '';
                        let highlight = '';
                        if (!col.isResult && columns.length > 2) {
                            const others = columns.filter(c => !c.isResult && c !== col).map(c => c.scales[q.id]).filter(v => v !== undefined);
                            if (others.length > 0 && val !== undefined) {
                                const avg = others.reduce((a,b) => a+b, 0) / others.length;
                                if (Math.abs(val - avg) >= 1.5) highlight = 'ring-2 ring-orange-400 rounded';
                            }
                        }
                        html += `<td class="py-2 px-2 text-center border-b border-slate-100 ${bg}"><div class="${highlight}">${val !== undefined ? scaleBoxes(val) : '<span class="text-slate-300">–</span>'}</div></td>`;
                    });
                    html += '</tr>';
                });
            });

            html += '</tbody></table>';
            html += '<p class="text-[10px] text-slate-400 mt-3 px-1">* Orámované buňky značí odchylku ≥ 1,5 bodu od průměru ostatních učitelů.</p>';

            document.getElementById('svodka-content').innerHTML = html;
            document.getElementById('svodka-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        async function saveData(silent = false) {
            if (!currentTargetEmail) return;
            if (userRole === 'teacher') {
                if (isClassTeacher) {
                    dbData.topNote = document.getElementById('schoolYearNoteInput').value;
                    document.getElementById('schoolYearNoteDisplay').textContent = dbData.topNote || "";
                    dbData.bottomNote = document.getElementById('summaryInput').value;
                    document.getElementById('summaryDisplay').textContent = dbData.bottomNote || "";
                } else {
                    const myEmail = auth.currentUser.email.toLowerCase();
                    if (!dbData.teacherNotes) dbData.teacherNotes = {};
                    dbData.teacherNotes[myEmail] = document.getElementById('summaryInput').value;
                }
                dbData.teacherScales = computeAveragedScales(dbData);
                const notes = dbData.teacherNotes || {};
                dbData.bottomNote = Object.entries(notes)
                    .filter(([, v]) => v && v.trim())
                    .map(([email, note]) => {
                        const nick = TEACHER_NICKNAMES[email] || email.split('.')[0];
                        return nick + ': ' + note.trim();
                    })
                    .join('\n\n');
            }
            dbData._savedAt = Date.now();
            await db.collection('evaluations').doc(currentTargetEmail).set(dbData, { merge: true });
            clearCache();
            if (!silent) {
                const t = document.getElementById('toast');
                t.innerHTML = '<i data-lucide="check-circle-2"></i> Úspěšně uloženo';
                t.style.transform = 'translateY(0)';
                t.style.opacity = '1';
                setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(24px)'; }, 2000);
            }
        }
    </script>
</body>
</html>
